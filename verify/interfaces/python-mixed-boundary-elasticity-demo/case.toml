id = "interfaces.python-mixed-boundary-elasticity-demo"
status = "implemented"
scope = "installed-python-root-plan-mixed-boundary-elasticity-common-result"
reference_kind = "existing-scientific-oracle-projected-through-common-model-first-lifecycle"

capabilities = [
  "python-component-source-and-caller-geometry-compilation",
  "python-root-linear-elasticity-plan-run",
  "python-common-displacement-field-output",
  "python-typed-linear-elasticity-observation",
  "python-headless-scaled-deformed-field-still",
]

[problem]
source = "the packaged component-only mixed-boundary-elasticity .eqi source"
geometry = "one Python GeometryGraph-authored rectangle with named topology supports"
mesh = "a caller-owned 16-by-16 Cartesian Q1 realization"
physics = "coherent-SI mixed-boundary isotropic linear elasticity, determined by the Model"
lifecycle = ".eqi -> eqiora.compile(geometry=...) -> eqiora.resolve(model, mesh, Q1, Linear, scaling=None) -> Plan -> eqiora.run(plan)"
result = "common eqiora.Result selected by the exact Plan-owned displacement FieldRef"
observation = "eqiora.solid.linear_elasticity_evidence(result) projects the native Plan-authenticated observation"
renderer = "eqiora.matplotlib.plot_deformed_field(result, field=plan.field('displacement'), scale=<explicit finite nonnegative value>)"

[oracle]
scientific_case = "solid.mixed-boundary-elasticity-2d"
matplotlib_contract = "ordinary installed Matplotlib product coverage; no registered presentation oracle"
policy = "scientific values and tolerances remain unchanged and owned by the existing structural case; this case checks installed composition and typed ownership"

[acceptance]
caller_geometry_is_the_only_concrete_geometry_authority = true
component_source_contains_no_concrete_box_or_duplicate_geometry = true
root_plan_uses_q1_and_explicit_linear_solver_policy = true
plan_publishes_exact_displacement_field_selector = true
common_result_field_output_is_coindexed_with_caller_mesh = true
linear_elasticity_observation_is_plan_authenticated = true
solver_reaction_body_force_and_bounds_relationships_are_preserved = true
foreign_field_and_cross_physics_observation_reject = true
unsupported_spatial_policy_rejects_without_fallback = true
displaced_solid_intent_plan_resolver_and_plot_shim_are_absent = true
headless_caller_owned_nonblank_png = true

[falsifiers]
duplicate_geometry_authority = "the .eqi source regains a concrete box definition"
foreign_field = "a FieldRef not owned by the exact Plan selects displacement output"
foreign_observation = "linear-elasticity observation accepts a steady-Stokes Result"
policy_fallback = "an unsupported MiniP1 structural policy silently substitutes Q1"
hidden_application_resolver = "LinearElasticity, its specialized Plan, or solid.resolve reappears"
retained_plot_shim = "plot_displacement reappears instead of the common field renderer"
raw_or_foreign_plot_input = "the renderer accepts values without the exact Result and Plan-owned field"
invalid_scale = "a negative or nonfinite deformation scale reaches rendering"
gui_dependency = "the Agg render requires DISPLAY"

[claim_boundary]
one_current_component_source = true
one_refinement = "16-by-16 Cartesian Q1"
intrinsic_dimension = 2
linear_isotropic_elasticity_only = true
common_displacement_field_output = true
typed_native_observation = true
stress_strain_or_traction = false
analytic_error_or_convergence = false
nonzero_boundary_data = false
unstructured_or_high_order_mesh = false
three_dimensional_nonlinear_or_dynamic_elasticity = false
fsi = false
interactive_viewer = false
exact_pixels_or_image_dimensions = false
scientific_validation_from_pixels = false

[evidence]
runner = "python-installed-wheel"
script = "tools/ci/python_distribution_gate.py"
