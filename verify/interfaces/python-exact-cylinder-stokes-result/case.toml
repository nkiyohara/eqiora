foreign_field_and_cross_physics_observation_reject = true
displaced_fluid_intent_plan_and_resolver_are_absent = true
installed_demo_uses_only_the_installed_component_source = true

[falsifiers]
duplicate_geometry_authority = "the .eqi source regains a concrete box or circle definition"
foreign_field = "a FieldRef not owned by the exact Plan selects pressure output"
foreign_observation = "steady-Stokes observation accepts an elasticity Result"
fresh_replay_split = "fresh and replayed equal Models require different resolver semantics"
hidden_application_resolver = "SteadyStokes, SteadyStokesPlan, or fluid.resolve reappears"
nonfinite_derived_observation = "finite operands overflow during native flux or momentum aggregation without rejection"
repository_resource_dependency = "the installed demo requires a repository Model JSON or private rewrite"

