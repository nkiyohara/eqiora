  "python-component-source-and-caller-geometry-compilation",
  "python-root-steady-stokes-plan-run",
  "python-common-pressure-field-output",
  "python-typed-steady-stokes-observation",
  "python-fresh-and-replayed-model-resolver-equivalence",
]

[problem]
source = "the packaged component-only steady-flow-past-cylinder .eqi source"
geometry = "one Python GeometryGraph-authored rectangle-minus-exact-circle with named boundary supports"
mesh = "the accepted deterministic 50-chord ReferenceMesher realization"
physics = "steady coherent-SI MINI/P1 Stokes, determined by the Model"
lifecycle = ".eqi -> eqiora.compile(geometry=...) -> eqiora.resolve(model, mesh, MiniP1, Linear, scaling=None) -> Plan -> eqiora.run(plan)"
result = "common eqiora.Result selected by the exact Plan-owned pressure FieldRef"
observation = "eqiora.fluid.steady_stokes_evidence(result) projects the native Plan-authenticated observation"

[oracle]
scientific_case = "fluid.exact-circular-hole-stokes-2d-gmsh"
geometry_case = "interfaces.python-exact-circular-hole-geometry"
mesh_case = "interfaces.python-circular-hole-chordal-mesh"
numeric_route = "verify/fluid/exact-circular-hole-stokes-2d-gmsh/routes/python/result.json"
policy = "scientific values and tolerances remain owned by the independent fluid case; this interface case checks composition and typed ownership"

[acceptance]
caller_geometry_is_the_only_concrete_geometry_authority = true
component_source_contains_no_concrete_box_or_duplicate_geometry = true
root_resolver_accepts_fresh_and_replayed_models = true
