tangent_or_insufficiently_clear_circle = "structured-validation-error"
empty_or_cross_dimension_selection_name = "structured-validation-error"
unknown_selection = "structured-validation-error-not-none"
mesh_or_approximation_argument = "no-constructor-parameter"

[claim_boundary]
