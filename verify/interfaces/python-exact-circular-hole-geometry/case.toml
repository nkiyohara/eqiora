id = "interfaces.python-exact-circular-hole-geometry"
status = "specified"
scope = "python-rust-owned-exact-axis-aligned-rectangle-with-one-circular-hole"
reference_kind = "existing-canonical-example-bytes-and-public-rust-identity-replay"

capabilities = [
  "python-rust-owned-exact-circular-hole-geometry",
  "python-canonical-circular-hole-json-and-digest",
  "python-fixed-role-named-selection-catalogue",
  "python-exact-geometry-validation-and-identity",
]

[problem]
geometry = "DFG-shaped 2.2 m by 0.41 m rectangle with one radius-0.05 m circle centred at [0.2, 0.2] m"
constructor = "eqiora.geometry.RectangleWithCircularHole"
canonical_source = "examples/steady-flow-past-cylinder.geometry.json"
region = "fluid, exact topological dimension 2"
boundaries = "inlet, outlet, walls, and cylinder, exact topological dimension 1"

[acceptance]
