id = "interfaces.studio-python-cad-round-trip"
status = "implemented"
scope = "deterministic-studio-python-projection-of-two-frozen-authored-cad-histories"
reference_kind = "exact-precommitted-generated-programs-over-existing-native-cad-oracles"

capabilities = [
  "studio-deterministic-public-python-authored-cad-export",
  "installed-python-execution-of-studio-authored-cad-export",
  "exact-authored-graph-round-trip-across-studio-and-python",
]

[generated_program]
encoding = "utf-8-without-bom"
line_endings = "lf-with-one-final-newline"
maximum_bytes = 4096
import = "public-installed-eqiora-package"
result_name = "authored_graph"
operations = "one-rectangle-extrusion-with-optional-one-circular-through-cut"
identity_guard = "exact-native-authored-graph-digest"
float_spelling = "eqiora-canonical-rust-debug-f64-no-plus-or-zero-padded-exponent"
canonical_blob = false
private_bridge = false

[acceptance]
exact_v1_and_v2_source_fixtures = true
isolated_installed_interpreter_outside_repository = true
exact_canonical_graph_bytes_and_digest = true
ordered_graph_bound_face_handles_and_observations = true
complete_analytic_build_receipt = true
native_studio_renderer_equals_frozen_source = true
precommitted_hostile_corpus = true

[falsifiers]
source_format_or_size_drift = "reject-before-publication"
private_import_or_canonical_blob = "reject-before-publication"
wrong_graph_digest = "generated-runtime-error"
non_public_or_source_tree_import = "isolated-installed-wheel-gate-fails"
native_renderer_fixture_drift = "studio-native-byte-for-byte-test-fails"

[claim_boundary]
two_frozen_histories_only = true
authored_graph_identity_not_output_geometry_identity = true
new_geometry_or_numeric_oracle = false
arbitrary_python_codegen_or_reverse_parse = false
mesh_model_physics_solver_or_visualization = false
cross_version_python_compatibility = false

[evidence]
runner = "python-installed-wheel"
script = "tools/ci/python_package_gate.py"
