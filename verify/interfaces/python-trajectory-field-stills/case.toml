solver_values = "reused unchanged from the accepted cases above; this case derives, tunes, and freezes no scientific value, tolerance, extremum, or unit conversion"
mesh_and_support = "the accepted 8-triangle connectivity and the accepted vertex support membership are wired verbatim from the registered trajectory evidence and are re-derived inside the test from that connectivity, never from coefficient values"
identity = "field selection is exact Model-bound FieldRef identity resolved through trajectory.state(step).field(field); neither structural equivalence nor a field id string is an authority. Independent compilation of one source allocates fresh semantic field ids, so the identical-id carrier is a committed value edit, which keeps every field id and changes only the exact Model artifact; that revised Model is never solved or plotted and contributes no scientific value, extremum, or tolerance"
limits = "scalar color limits are exactly the minimum and maximum over the support-restricted vertex values"
geometry = "deformed positions are exactly coordinates + scale * values, evaluated on the support-restricted reference mesh"
images = "no pixel, byte, hash, dimension, layout, font, or colormap baseline is frozen"

[contract]
purpose = "decisions the implementer must not revisit; each one is what the registered evidence extracts"
scalar_renderer_call = "Axes.tripcolor(x, y, values, triangles=<admitted cells>, shading='gouraud', ...) with exactly three positional arguments"
scalar_coordinates = "x and y are exactly trajectory.coordinates columns zero and one, whole mesh, unpermuted"
scalar_values = "the complete whole-mesh vertex block from FieldSnapshot.values('vertex'), passed unchanged and never gathered, compressed, or renumbered"
scalar_connectivity = "exactly trajectory.cells[admitted cells] in ascending cell order, carrying global canonical vertex indices"
scalar_limits = "the artist color limits equal the support-restricted extrema; the zero-extended outside-support entries are never limit authorities"
deformed_renderer_call = "two matplotlib.collections.LineCollection artists added to the field axes"
deformed_artist_order = "figure.axes[0].collections[0] is the reference wireframe and [1] is the deformed wireframe"
deformed_edges = "the sorted unique undirected edge tuples of the admitted cells, each drawn once, with endpoints in ascending vertex order and edges in ascending lexicographic order"
figure_axes = "figure.axes[0] is the field axes for both stills"
figure_binding = "the Figure is constructed through the module-level eqiora.matplotlib.Figure name"
axis_labels = "x [m] and y [m] with equal spatial aspect; no unit name is derived for the field itself"
visible_scale = "the applied scale is visible in the deformed axes title or in an artist label"
rejection_types = "TypeError for a non-Trajectory first argument; ValueError for a foreign exact Model, a violated shape/frame/dimension/association requirement, or a non-finite or negative scale; KeyError for an absent field or association; IndexError for an absent step"
rejection_vocabulary = "a contract ValueError message names the violated requirement with one of `value shape`, `frame`, `dimension`, `association`, or `finite and nonnegative`"
exports = "eqiora.matplotlib.__all__ is exactly the sorted plot_deformed_field, plot_displacement, plot_scalar_field"

