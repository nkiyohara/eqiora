identical_field_id_from_another_model = "a FieldRef whose semantic field id is present in the accepted inventory but whose exact Model artifact differs is accepted, or is rejected only after a Figure exists"
name_reconstructed_identity = "selection resolves a field id string or a structural match instead of the exact Model-bound FieldRef; an id-inventory membership test alone admits the value-edited Model and is rejected by that fixture"
non_trajectory_input = "a raw array, an FSI result, or an arbitrary object reaches the renderer"
absent_step_field_or_association = "an out-of-range step, an out-of-inventory field, or an undeclared association returns a Figure instead of propagating IndexError or KeyError"
wrong_scalar_shape_frame_or_association = "a vector, spatial-cartesian, or multi-association field is drawn as a scalar still"
velocity_as_deformation = "solid_velocity or fluid_velocity is accepted as a deformation; only the SI length dimension separates solid_velocity from solid_displacement here"
pressure_as_deformation = "an invariant scalar is accepted as a deformation"
support_free_cells = "a cell with any vertex outside the accepted support is drawn, or an admitted cell is dropped"
closure_mismatch = "the drawn vertex closure differs from the accepted support, or an empty admission returns a Figure"
support_renumbering = "compressed or local indices replace global canonical mesh-entity indices in the drawn connectivity"
value_gathering = "the scalar block is compressed to its support instead of being passed unchanged with support-restricted connectivity"
whole_block_scalar_limits = "color limits are taken over the zero-extended block instead of the support-restricted values"
automatic_retriangulation = "the captured tripcolor invocation omits explicit accepted triangles"
coordinate_axis_swap_or_permutation = "captured x/y or values differ from the accepted co-indexed arrays"
wrong_deformed_geometry = "drawn deformed segments differ from coordinates + scale * values on the admitted edges"
duplicated_or_missing_edges = "a shared edge is drawn twice, or the sorted unique undirected edge set differs"
ignored_step = "both accepted steps produce identical deformed geometry"
nonfinite_or_negative_scale = "an infinite, NaN, or negative scale reaches the renderer"
unlabelled_scale = "the applied scale appears in no title or artist label"
input_mutation = "a trajectory, state, or snapshot digest, a memoized array identity, its read-only flag, or a support membership changes after plotting"
result_lifetime = "extracted renderer inputs change or the Figure fails to save after the trajectory is released"
nondeterministic_inputs = "a repeated call on the same accepted inputs extracts different renderer arrays"
gui_dependency = "Agg render runs with DISPLAY absent"
