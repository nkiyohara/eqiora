id = "interfaces.prescribed-dynamic-solid-subprocess-provider-3d"
status = "verified"
scope = "one-connected-deterministic-stateless-prescribed-solid-boundary-provider-occurrence-3d"
reference_kind = "independent-standard-library-framed-transcript-and-exact-artifact-oracle"

capabilities = [
  "application-created-connected-subprocess-boundary-provider",
  "exact-two-trace-one-candidate-framed-session",
  "bitwise-affine-candidate-admission",
  "role-preserving-provider-occurrence-artifact",
  "accepted-state-and-occurrence-two-output-run",
  "failure-atomic-session-poisoning",
]

[problem]
ambient_dimension = 3
source_case = "artifacts.prescribed-dynamic-solid-state-run-3d"
projection = "x-upper vertices one three five seven in ascending vertex/component order"
inputs = "prior displacement and prior velocity traces"
output = "next total displacement"
time_step_s = 0.25

[provider_profile]
runtime = "ordinary-GIL CPython 3.12"
provider = "eqiora.python.prescribed-dynamic-solid-affine 1.0.0"
dependencies = "normalized cpython 3.12 and exact numpy 2.1.0"
target = "host CPU"
scalar = "contiguous little-endian binary64"

[protocol_contract]
connected_child_only = true
control_frames = 8
bulk_frames = 3
aggregate_bulk_bytes = 288
provider_evaluations = 1
clean_close_eof_and_zero_exit_required = true
timeout_per_wait_seconds = 5

[falsifiers]
framing = "reject malformed prefix, kind, reserved bytes, length, truncation, or budget"
control = "reject malformed or noncanonical JSON and closed-DTO or policy drift"
state_machine = "reject reordered, duplicate, extra, late, or incomplete responses"
projection = "reject stale resources, roles, vertex order, descriptors, or input order"
candidate = "reject invalid binary64 and every value except the frozen affine predictor bits"
identity = "reject binding, input, request, candidate, transcript, occurrence, or Run drift"
process = "reject provider error, broken pipe, timeout, cancellation, dirty EOF, or nonzero exit"
publication = "return no partial owner, State, occurrence, or Run"

[claim_boundary]
one_exact_prescribed_solid_occurrence = true
application_retains_launch_authority = true
separate_two_output_run = true
direct_singleton_run_unchanged = true
arbitrary_model_field_mesh_boundary_or_step = false
provider_authored_semantics_or_acceptance = false
session_reuse_or_multiple_evaluations = false
traction_or_two_way_conservative_coupling = false
embedded_python_callback_or_binding = false
remote_gpu_mpi_shared_memory_or_zero_copy = false
performance_portability_or_scale = false

[evidence]
package = "eqiora"
test = "prescribed_dynamic_solid_subprocess_provider_3d"
environment = "host-cpu"
