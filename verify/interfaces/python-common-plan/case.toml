id = "interfaces.python-common-plan"
status = "verified"
scope = "python-common-model-mesh-spatial-solve-plan"
reference_kind = "public-rust-application-service-through-pyo3"

capabilities = [
  "python-common-root-capability-resolution",
  "python-model-mesh-owned-plan",
  "python-typed-q1-spatial-policy",
  "python-typed-cell-centred-tpfa-spatial-policy",
  "python-typed-reference-linear-solve-policy",
  "python-plan-owned-run",
  "python-common-plan-separate-effective-identities",
]

[problem]
model = "one-dimensional constant-source Poisson with two essential boundaries"
mesh = "typed model-unbound Cartesian density request, realized exactly from the Model Domain during Plan resolution"
spatial = ["continuous-q1-galerkin", "cell-centred-orthogonal-tpfa"]
solve = "host-serial reproducible conjugate gradient with identity preconditioner"

[claim_boundary]
model_is_mathematical_authority = true
mesh_request_repeats_domain_geometry = false
effective_mesh_is_plan_owned = true
plan_owns_model_and_mesh = true
plan_publishes_effective_policies = true
run_requires_repeated_model = false
general_pde_resolution = false
non_cartesian_mesh = false
generic_polynomial_order = false
string_policy_registry = false
solver_choice = false
backend_choice = false
placement_choice = false
temporal_policy = false

[evidence]
package = "eqiora-python"
test = "python_common_plan"
