trajectory_case = "artifacts.general-fixed-mesh-field-trajectory-2d"
fsi_case = "interfaces.python-fixed-reference-fsi-demo"
identity = "projection identities equal the exact accepted artifact lineage; the projection assigns no new durable identity"
ordering = "state, Field, and block occurrences follow accepted artifact edges and are never rebuilt from digest-keyed catalogs"
