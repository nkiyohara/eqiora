id = "interfaces.studio-cad-authored-graph"
status = "implemented"
scope = "two-closed-authored-cad-histories-through-native-studio-owner-replay"
reference_kind = "presentation-only-projection-of-existing-frozen-cad-evidence"

capabilities = [
  "native-studio-authored-cad-history-editor",
  "exact-authored-graph-identity-and-canonical-replay",
  "graph-bound-semantic-face-selection",
  "complete-analytic-build-receipt-and-lineage-presentation",
]

[canonical_contract]
protocol = "eqiora.studio.cad-authored/v1"
histories = "rectangle-closed-face-positive-z-extrusion; optional one strictly interior circular through-cut"
graph_owner = "eqiora-geometry::GeometrySolidOperation"
rectangle_authority = "geometry.cad-authored-rectangle-extrusion"
cut_authority = "geometry.cad-authored-circular-through-cut"
maximum_operations = 8
maximum_faces = 7
canonical_graph_bytes = "opaque bounded lowercase hex"
face_handles = "opaque bounded graph-bound lowercase hex"
browser_preview = "reject without fabricated identity or observations"

[presented_evidence]
identity = "authored graph digest and exact canonical byte count"
history = "complete four-step or eight-step dependency order"
geometry = "owner-projected bounds, counts, topology, volume, surface area, and face observations"
build = "provider profile, requested/effective tolerances, discrepancies, repair, and complete topology lineage"
selection = "native replay of the exact canonical graph and graph-bound face handle"

[falsifiers]
unknown_or_incoherent_protocol_field = "reject-before-ready-publication"
nonfinite_degenerate_or_owner_invalid_scalar = "reject-without-projection"
mutated_unknown_duplicate_or_oversized_canonical_wire = "reject-before-selection"
foreign_stale_mutated_or_cross_version_handle = "reject-before-selected-state"
stale_graph_digest = "reject-before-handle-resolution"
superseded_build_or_selection_response = "discard-before-publication"
selection_semantic_echo_mismatch = "reject-before-selected-state"
browser_identity_or_geometry_fabrication = "forbidden"

[claim_boundary]
two_frozen_histories_only = true
native_owner_replay = true
exact_graph_identity_and_observation_projection = true
semantic_face_selection = true
general_operation_dag = false
pure_output_geometry_digest = false
cad_tessellation_or_rendering = false
mesh_model_solver_or_python = false
arbitrary_graph_editing = false
provider_selection_import_or_healing = false
studio_to_python_export = false

[evidence]
package = "eqiora-geometry"
test = "cad_authored_circular_through_cut"
