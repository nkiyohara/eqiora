id = "geometry.cad-authored-face-reference-mesh"
status = "specified"
scope = "one-source-bound-rectangular-authored-face-realized-as-one-planar-reference-mesh"
reference_kind = "dual-independent-analytic-and-exact-rational-enumeration-oracle"

capabilities = [
  "graph-bound-authored-face-surface-realization",
  "axiswise-target-edge-length-selection",
  "exact-planar-frame-lift",
  "source-bound-geometry-mesh-correspondence",
]

[problem]
source = "one admitted rectangular face handle on one immutable authored CAD graph"
witness = "rectangle x [-2,3] m, y [-1,2] m, z0 0.5 m, depth 4 m; select end-cap"
geometry_classification_tolerance_m = 5e-10
target_edge_length_m = 2.0
minimum_cell_quality = 0.95
maximum_triangles = 24
sizing_rule = "least integer n >= 1 per axis satisfying binary64 D(n).hypot(D(n)) <= h, where s = L/n, x_i = i*s for i<n, x_n = L, and D is the maximum realized adjacent gap"
indexing_rule = "k = j * (nu + 1) + i, u-fast"
cell_rule = "for a,b,c,d at each grid square emit (b,c,a), then (d,a,c)"

[oracle]
analytic_route = "closed-form structured-grid topology, orientation, area, perimeter, and quality derivation"
independent_route = "exact Fraction coordinate enumeration with undirected-edge multiplicities and determinant areas"
agreement = "all frozen witness values and all rejection boundaries agree before implementation"

