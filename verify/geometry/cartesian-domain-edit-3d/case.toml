id = "geometry.cartesian-domain-edit-3d"
status = "implemented"
scope = "current-model-one-body-two-axis-topology-preserving-cartesian-edit"
reference_kind = "independently-compiled-target-and-geometry-identity-replay"

capabilities = [
  "exact-cartesian-domain-edit-preview-and-commit",
  "topology-preserving-domain-identity",
  "content-bound-geometry-successor-association",
]

[problem]
base = "one current Model with one 3D Cartesian body and six oriented boundaries"
edit = "atomically replace x [-0.5, 0.5] with [-0.6, 0.6] and z [-0.5, 0.5] with [-0.75, 0.75]"
oracle = "separately compiled target fixture, unchanged y interval, and independently evaluated 1.8 m^3 volume"

[canonical_contract]
mutation = "ordinary current Model transaction over one immutable base revision"
retained_identity = "body and boundary Domain IDs, Cartesian roles, Model membership, and all body incidence"
changed_identity = "exact Model digest and Geometry Identity digest"
selection_retention = "explicit total one-to-one geometry-revision association"

[falsifiers]
caller_permutation = "axis permutations reproduce equal plans, byte-identical transactions and children, and equal digests"
partial_application = "x-only child differs from the target fingerprint, z interval, digest, and 1.8 m^3 volume oracle"
cardinality_one = "one-axis request remains an ordinary one-member instance of the same plan"
empty_edit_set = "reject before operation construction"
duplicate_axis = "reject the complete set before operation construction"
mixed_valid_and_no_op = "reject the complete set without a partial child revision"
same_revision_foreign_model_digest = "reject before mutation"
stale_child_revision = "reject before mutation"
no_op_interval = "reject"
out_of_axis = "reject"
boundary_as_body_target = "reject"
two_dimensional_body = "reject"
multiple_cartesian_bodies = "reject"
non_finite_or_reversed_axis_bounds = "reject at typed AxisBounds construction"
missing_boundary_of_edge = "edge-only replay fails; a replayable missing-role mutant is rejected by Geometry Identity"

[claim_boundary]
model_owner = "current"
historical_generation_callable = false
one_cartesian_body = true
three_dimensions = true
non_empty_axis_keyed_edit_set = true
two_axes_in_fixture = true
topology_change = false
multiple_bodies = false
source_rewriting = false
parameter_driven_geometry = false
cad_feature_history = false
mesh_regeneration_product_api = false

[evidence]
package = "eqiora"
test = "cartesian_domain_edit"
