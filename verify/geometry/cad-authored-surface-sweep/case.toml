[falsifiers]
foreign_or_stale_surface_or_graph = "exact graph-revision and handle/source-surface match rejects before volume topology allocation"
circular_through_cut_target = "the cut graph rejects; its outer bounds must never be filled"
outward_or_reversed_sweep = "killed by the frozen inward normal, exact layer planes, and ordered cells"
zero_layers = "reject before allocation"
growth_below_one_zero_nan_or_infinite = "growth 0.5, 0, NaN, and +infinity each reject before allocation"
maximum_tetrahedra_2_or_1000001 = "reject before allocation; outside [3, 1000000]"
maximum_tetrahedra_143_primary = "reject the primary witness before allocation because required is 3*24*2 = 144"
checked_overflow = "an overflowing 3 * source_triangles * layers rejects before allocation"
offset_underflow_or_collapse = "generated offsets that underflow, collapse, or stop strictly increasing reject despite a satisfied budget"
minimum_quality_0_24_primary = "reject because the generated minimum 2*30^(2/3)/83 is strictly below 0.24, while 0.23 accepts"
half_depth_or_cavity_exterior_facets = "artificial exterior facets fail the frozen boundary/interior facet counts and per-face inventory"
partial_body_or_missing_boundary_assignment = "all incomplete correspondence rejects; the complete body and all six boundary assignments are required"
local_triangle_order_prism_split = "a per-triangle local-order split cracks shared vertical quads and fails conformance and the frozen facet counts"
slab_direction_or_growth_reversal = "killed by the exact ordered cells and exact offsets even if topology and quality still pass"
infinite_plane_membership = "generic correspondence uses bounded face membership, not infinite plane membership"

