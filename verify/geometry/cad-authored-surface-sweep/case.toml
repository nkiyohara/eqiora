id = "geometry.cad-authored-surface-sweep"
status = "specified"
scope = "one-accepted-authored-face-surface-swept-inward-through-one-uncut-body-into-one-conforming-positively-oriented-tetrahedral-volume-mesh"
reference_kind = "dual-independent-analytic-and-clean-room-enumeration-oracle"

capabilities = [
  "source-bound-authored-surface-inward-sweep",
  "geometric-source-relative-layer-grading",
  "total-order-conforming-prism-to-tetrahedron-split",
  "complete-body-and-six-boundary-generic-correspondence",
]

[problem]
source = "one accepted source-bound rectangular authored-face surface mesh on any of the six full outer faces of the same exact immutable uncut one-body authored rectangle-extrusion graph"
witness = "rectangle x [-2,3] m, y [-1,2] m, z0 0.5 m, depth 4 m; all six full outer faces eligible"
target_model = "models/box.eqi - the generic 3D Cartesian body model with six derived boundary domains that receives the correspondence"
owner = "one no-wire owner retains the accepted source surface, exact target graph/body, inward orientation, layer count, source-relative growth rate, binary64 layer offsets, caller maximum tetrahedra, the reused SimplicialMesh quality gate/report, and the volume mesh"
correspondence = "complete body and all-six-boundary correspondence is accepted only through the existing generic Cartesian Model/Geometry/Mesh artifact boundary"
membership_rule = "generic correspondence uses bounded face membership, not infinite plane membership"
layers_gate = "layers positive"
growth_gate = "growth finite and >= 1"
maximum_tetrahedra_gate = "maximum_tetrahedra in [3, 1000000]"
required_tetrahedra_rule = "required tetrahedra checked as 3 * source_triangles * layers and <= caller maximum; all checks before volume topology allocation"
source_match_rule = "graph revision and handle/source surface must exactly match the target"
admission_rule = "only the current exact axis-aligned rectangle-extrusion graph with one body and six full rectangular faces"
inward_rule = "inward = -(parent outward normal)"
distance_rule = "distance = target box width on the sweep normal axis"
grading_rule = "geometric thickness ratio delta(k+1)/delta(k) = growth from the source inward, normalized overflow-safely"
offset_rule = "offset_0 = 0 exact, final offset = distance exact, and the target normal coordinate snaps to the opposite exact bound; generated offsets strictly increasing and finite; collapse rejects"
vertex_index_rule = "volume vertex index = layer * V + source index"
loop_order_rule = "source triangle outer loop, slab inner loop"
split_rule = "sort each triangle's global vertex labels s0 < s1 < s2; emit [b0,b1,b2,t2], [b0,b1,t1,t2], [b0,t0,t1,t2]"
orientation_rule = "if the signed global xyz determinant is negative swap entries 1 and 2; zero or non-finite determinant rejects"
diagonal_rule = "every shared vertical quad takes the bottom-min to top-max diagonal"
quality_rule = "q = 3 * abs(det J)^(2/3) / sum(J_ij^2), the existing SimplicialMesh gate/report, evaluated in production exactly as Rust left-associated dimension * det.abs().powf(2.0 / dimension) / frobenius_squared"

[oracle]
analytic_route = "Fable 5: closed-form prism-stack topology, exact rational determinant and Frobenius algebra, algebraic minimum quality, and one-ulp binary64 analysis derived from the frozen public claim"
independent_route = "Opus 5: clean-room exact-rational enumeration of every vertex, ordered oriented cell, edge and facet multiset, semantic boundary inventory, and exact quality comparison from the same frozen public claim"
agreement = "all frozen witness values and all rejection boundaries agreed on 2026-08-01 before implementation began"

