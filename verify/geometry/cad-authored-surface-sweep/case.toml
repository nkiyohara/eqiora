[exact_reapplication.minimum_determinant_disposition]
finding = "a per-cell ideal-real determinant is reachable in exact arithmetic only where both source axes divide their length exactly in binary64"
z_pair = "both axes divide exactly; 5/4 is realized and the cap multiset is exactly 5/4 x72 and 15/4 x72"
x_and_y_pairs = "the length-4 axis at three intervals uses fl(4/3), so the realized exact minima are 5/3 - 5/(3*2^54) and 5/4 - 5/2^56"
lateral_multiset_size = "four distinct exact determinants per lateral face, not two, because the third realized gap on the length-4 axis differs from the first two"
field_amendment = "the lateral witnesses now carry minimum_determinant_exact_m3 as the realized dyadic value and minimum_determinant_ideal_real_m3 as the preserved reference, so no field named exact holds an unrealized value; minimum_quality_exact on those witnesses is likewise renamed minimum_quality_ideal_real"
consequence = "assert the realized values or the telescoped sum, never a relaxed tolerance"

[exact_reapplication.non_gating_f64_fold_note]
status = "NON-GATING explanation only. No value below is frozen as a constant and nothing here gates the script or the case."
subject = "the naive left fold of fl(det/6) in binary64 over a cap cell sequence"
finding = "the fold moves under reassociation of the same terms - emission, ascending, and descending order disagree, while compensated summation returns 60.0 - so it cannot be an acceptance oracle; the exact rational 60/1 is the order-independent quantity"
classification = "both independent repair lanes classified it as a non-claiming test defect: not an implementation defect and not a reason for a tolerance"
reproducibility = "deterministic on any IEEE-754 platform, since only correctly rounded multiply, subtract, divide, and add are involved; order dependence is the issue, not reproducibility. The script reports the values and asserts none of them."

