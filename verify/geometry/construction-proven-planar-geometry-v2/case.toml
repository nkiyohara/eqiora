id = "geometry.construction-proven-planar-geometry-v2"
status = "verified"
scope = "one-scale-independent-axis-aligned-rectangle-minus-circle-geometry-derived-from-the-accepted-authored-cad-lineage"
reference_kind = "independent-exact-artifact-oracle-plus-structural-scale-family-and-lineage-falsifiers"

capabilities = [
  "closed-construction-proven-planar-geometry-v2",
  "scale-independent-strict-clearance-admission",
  "immutable-owner-bound-dimension-carrying-result-handles",
  "complete-atomic-result-topology-naming",
  "canonical-v2-replay-without-classification-tolerance",
  "exact-ordinary-dfg-v2-canonical-identity",
]

[problem]
construction = "accepted rectangle extrusion plus one circular through-all cut and exact analytic build receipt"
projection = "positive-z section face, four retained side edges, and created circular edge"
scale_family = "2^-40, 1, and 2^40 applied uniformly to all coordinates, lengths, and upstream CAD tolerances"
naming = "fluid, inlet, outlet, walls, and cylinder from complete typed result membership"

[oracle]
geometry_predicates = "finite increasing bounds, finite positive radius, finite arithmetic, and strict positive side clearance"
topology = "one face plus five edges projected only from exact retained/created construction lineage"
canonical_replay = "closed unknown-field-denying v2 wire reconstructs through the validating constructor and must reproduce its input byte-for-byte"
exact_v2_oracle = "standalone Python literal, hand encoder, and stdlib JSON construction independent of the Rust serializer"
exact_v2_bytes = 511
exact_v2_sha256 = "1811037532ef5697a2c331d47786d39b2a0d3a64b2f348e7859342e742fecca0"
identity = "SHA-256 over the v2 schema domain, one NUL separator, and the complete canonical bytes"
new_scientific_tolerance = false

[falsifiers]
scale = "all three uniform scales admit with identical name/dimension/provenance membership"
geometry = "nonfinite, degenerate, zero/negative/nonfinite radius, tangent, and outside inputs reject"
lineage = "incomplete, changed, deleted, split, merged, and foreign-build lineage reject before topology publication"
handle_owner = "foreign and stale source or result owner identity rejects"
deleted_section_member = "start-cap does not project into the positive-z result section"
naming = "empty, incomplete, duplicate, and mixed-dimensional groups reject atomically"
wire = "exact v2 literal replays byte-for-byte; unknown, duplicate, tolerance/classification, reordered, equivalent-number-spelling, and noncanonical-member wire mutants reject"
plain_hash = "plain JSON SHA-256 bdcd32d3829ad1bf7b8ef455a09bdbe863db88dc6454584381ef38421ea29ddc is not the v2 identity"
signed_zero = "negative coordinate zero normalizes to the one frozen exact identity"
compatibility = "frozen v1 remains 511 bytes, retains exact digest and tolerance bits, and is never artifact-equal to v2"

[claim_boundary]
one_rectangle_minus_circle_family = true
construction_owned_source_topology = true
provider_index_or_coordinate_recovery = false
classification_or_absolute_naming_threshold = false
generic_brep_or_boolean_lineage = false
imported_mesh_classification = false
public_python_post_build_naming = false
exact_ordinary_dfg_v2_identity = true

[evidence]
runner = "cargo-library-test"
package = "eqiora-geometry"
test = "cad_authored_result_topology::tests::registered_construction_geometry_v2_evidence"
