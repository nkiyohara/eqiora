id = "solid.prescribed-dynamic-solid-step-3d"
status = "verified"
scope = "one-in-memory-prescribed-total-displacement-backward-euler-p1-tetrahedral-solid-step-3d"
reference_kind = "dual-independent-affine-continuum-and-exact-rational-finite-element-oracle"

capabilities = [
  "immutable-model-geometry-mesh-correspondence-and-prior-field-binding",
  "live-velocity-traction-port-total-displacement-candidate-admission",
  "serial-host-p1-tetrahedron-exact-quadrature-backward-euler-step",
  "complete-next-displacement-velocity-and-acceleration",
  "fixed-and-driven-constraint-on-body-reactions",
  "captured-mass-stiffness-reduced-system-and-backend-evidence",
  "generation-bound-fail-atomic-candidate-acceptance",
]

[problem]
ambient_dimension = 3
domain = "unit cube [0 m, 1 m]^3"
mesh = "nine exact ordered vertices and twelve exact ordered positive affine tetrahedra"
space = "continuous vector P1 displacement and velocity"
density_kg_per_m3 = 2.0
shear_modulus_pa = 3.0
first_lame_parameter_pa = 0.0
time_step_s = 0.25
time_method = "backward Euler"
execution = "one-thread serial host with reproducible reductions"

[canonical_contract]
momentum = "rho * derivative(velocity) - div(2 mu sym(grad(displacement)) + lambda div(displacement) I) = 0"
kinematics = "derivative(displacement) - velocity = 0"
fixed_boundary = "x=0 TraceZero velocity"
driven_boundary = "x=1 live velocity/traction PortBinding"
natural_boundaries = "y=0, y=1, z=0, and z=1 FluxZero"
candidate_treatment = "L3 total displacement at t_(n+1), never an increment or velocity"
new_semantic_boundary_law = false

[numerical_contract]
quadrature = "exact affine P1 tetrahedron mass and stiffness integration"
solver = "ConjugateGradient"
preconditioner = "Identity"
reduction = "Reproducible"
relative_tolerance = 1e-13
absolute_tolerance = 1e-15
maximum_iterations = 500
caller_selectable_target_schedule_or_solver_policy = false

[acceptance]
exact_vertex_and_tetrahedron_order_precedes_reaction_assertions = true
accepted_generation = 1
center_displacement_m = [0.0075, 0.0, 0.0]
center_velocity_m_per_s = [0.01, 0.0, 0.0]
center_acceleration_m_per_s2 = [0.0, 0.0, 0.0]
center_mass_diagonal = 0.2
center_stiffness_diagonal = 16.0
center_backward_euler_diagonal = 19.2
fixed_face_reaction_n = [-0.09, 0.0, 0.0]
driven_face_reaction_n = [0.09, 0.0, 0.0]
free_momentum_residual_norm_n_at_most = 1e-11
kinematic_residual_norm_m_per_s_at_most = 1e-13
failure_leaves_generation_unchanged = true

[falsifiers]
stale_generation_or_lineage = "reject before assembly"
wrong_prior_field_count_order_identity_duplicate_missing_or_nonfinite = "reject during reference construction"
wrong_candidate_count_order_identity_duplicate_missing_or_nonfinite = "reject before assembly"
invalid_time_quantity = "reject non-time, non-finite, zero, or negative values"
wrong_boundary = "reject fixed, natural, foreign, overlapping, or non-live boundary"
changed_face_diagonal = "reject rather than reuse node-indexed reactions"
candidate_as_increment = "rejected by exact total displacement and derived velocity checks"
stale_velocity_or_ignored_candidate = "changed-candidate boundary velocity must equal the backward difference"
density_omission_or_lumping = "separate M_88 must be 1/5 I, not 1/10 I or 1/2 I"
shear_omission_doubling_or_lame_swap = "separate K_88 must be 16 I, not 8 I, 24 I, or 4 I with lateral traction"
reaction_sign_or_equal_corner_split = "complete node-indexed reaction vector and both face totals must match"
assembly_or_solver_failure = "return no result and do not advance the accepted generation"

[claim_boundary]
in_memory_reference = true
serial_host = true
one_step = true
total_displacement_candidate = true
exact_fixture_only = true
standalone_solid_realization_or_state = false
durable_artifact_or_run = false
python_subprocess_protocol_or_studio = false
gpu_mpi_or_parallel_execution = false
provider_supplied_traction_or_two_way_coupling = false
nonlinear_solid_remeshing_or_arbitrary_boundary_law = false
general_nonzero_lambda_or_acceleration_validation = false
performance_or_scale = false

[evidence]
package = "eqiora"
test = "prescribed_dynamic_solid_step_3d"
