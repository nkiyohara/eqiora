id = "solid.packaged-isotropic-balance-2d"
status = "verified"
scope = "exact-two-package-2d-isotropic-balance-to-host-serial-q1-csr-cg"
reference_kind = "identity-normalized-structure-lowered-equivalence-convergence-and-exact-lineage"

capabilities = [
  "exact-packaged-isotropic-balance-component",
  "field-slot-to-name-independent-elasticity-lowering",
  "packaged-and-explicit-flat-elasticity-equivalence",
  "identity-preserving-root-parameter-forwarding",
  "packaged-elasticity-realization-and-run-lineage",
]

[problem]
dependency = "Eqiora.Solid.LinearElasticity@0.1.0"
equation = "-div(2 mu sym(grad(u)) + lambda I div(u)) - grad(q) = 0"
domain = "(0 m, 1 m) x (0 m, 1 m)"
fields = "u: [2] spatial displacement; q: invariant scalar load potential"
boundary = "u = [0, 0] on all four root-owned sides"

[canonical_contract]
packages = 2
package_wire = 1
model_wire = 4
component_owned_domains = 0
component_owned_fields = 0
component_owned_relations = 1
component_support_slots = 1
component_field_slots = 2
component_parameters = 2
root_owned_fields = 2
root_owned_parameters = 4
root_owned_boundary_domains = 4
root_owned_boundary_relations = 4
identity_normalized_flat_structure = true
lowered_operator_equivalence = true
