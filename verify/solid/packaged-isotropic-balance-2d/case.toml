dependency_alias_and_order_invariance = true
provider_package_name_is_not_a_lowering_or_execution_key = true

[realization]
method = "continuous-galerkin"
mesh = "generated-cartesian"
space = "continuous-q1"
quadrature = "tensor-product-gauss-legendre-2-per-axis"
scalar_type = "f64"
vector_layout = "replicated"
solver = "conjugate-gradient"
placement = "one-host-process-one-worker"
realization_wire = 1
run_wire = 2

[claim_boundary]
material = "constant intrinsic-2d isotropic small strain"
load = "root-owned manufactured and nonzero affine conservative potentials"
boundary = "four root-owned homogeneous displacement traces"
exact_offline_package_compilation = true
explicit_flat_equivalence = true
package_execution_binding = true
traction_port_or_boundary_partition = false
plane_stress_or_plane_strain = false
three_dimensional_execution = false
unstructured_mixed_high_order_or_adaptive = false
nonlinear_dynamic_or_fsi = false
general_package_executor = false

[equilibrium]
quantity = "boundary-reaction-plus-integrated-grad-q-per-component"
nonzero_affine_potential = true
integrated_body_force = "[1, 0]"
maximum_absolute_error = 2e-11

[evidence]
package = "eqiora"
test = "packaged_isotropic_balance_2d"
