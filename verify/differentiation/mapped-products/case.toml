id = "differentiation.mapped-products"
status = "implemented"
scope = "real-first-order-accepted-map-products-with-explicit-shared-coordinate-sums"
reference_kind = "hand-derived-chain-rule-and-independent-pointwise-products"

capabilities = [
  "explicit-shared-and-mapped-parameter-coordinates",
  "sum-not-mean-shared-vjp",
  "multiple-first-order-seeds",
  "nested-point-and-seed-axis-interchange",
  "retained-point-linearization-and-occurrence-evidence",
  "finite-and-checked-numerical-buffer-admission",
]

[oracle]
analytic_function = "f(s,x) = (s*x + x^2, 2*s - 3*x)"
shared_point = 2
mapped_points = [1, 3, 1]
shared_jacobian_column = "(x, 2)"
mapped_jacobian_column = "(2 + 2*x, -3)"
shared_tangent = 0.5
mapped_tangents = [1, -2, 0.25]
cotangents = [[1, 2], [-1, 1], [2, -1]]
jvp = [[4.5, -2], [-14.5, 7], [1.5, 0.25]]
shared_vjp = 4
mapped_vjp = [-2, -11, 11]
duality_pairing = 24.75
numeric_reference = "ordinary immutable Q1/TPFA evaluation.jvp/vjp calls outside mapped-product execution"
pointwise_science_owner = "differentiation.spatial-poisson-fem-fvm"
new_solver_tolerance = false
finite_difference_oracle = false

[acceptance]
every_declared_occurrence_and_seed_retained = true
shared_values_and_parameter_identity_admitted = true
partial_primal_does_not_publish_gradient = true
no_primal_resolve_under_retain = true
recompute_requires_exact_original_acceptance = true
foreign_or_stale_linearization_rejected = true
shared_sum_uses_request_order = true
byte_products_and_nonfinite_values_fail_closed = true

[falsifiers]
mean = "dividing the shared cotangent by the number of points changes the frozen answer"
deduplication = "a repeated point loses its distinct nonzero mapped cotangent"
axis_transpose = "independent point-major, seed-major and interleaved offsets disagree"
stale_product = "an action from another accepted point or Program enters the product"
recomputed_product = "explicit recomputation changes the frozen point/receipt or shared request-order sum"
partial_primal = "a missing planned member is accepted for product construction"
overflow = "a nonfinite sum or unrepresentable numerical buffer is admitted"

[claim_boundary]
scalar = "native-f64"
methods = ["continuous-q1-galerkin", "cell-centered-tpfa"]
derivative_order = 1
pairing = "existing-real-coordinate-pairing"
record_axis_rank_limit = 32
retained_numerical_bytes_not_peak_memory = true
complex = false
solver_iteration_differentiation = false
second_derivatives = false
python_or_framework_batching = false
stochastic_sampling = false
parallel_execution = false

[evidence]
runner = "cargo-library-test"
package = "eqiora-api"
test = "evaluation_map::products::tests::registered_mapped_product_contract"
