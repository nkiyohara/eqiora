id = "differentiation.bounded-parameter-study"
status = "implemented"
scope = "ordered-host-serial-q1-and-tpfa-maps-of-complete-parameter-points"
reference_kind = "separately-executed-accepted-evaluations"

capabilities = [
  "exact-program-bound-ordered-evaluation-map",
  "complete-multiple-parameter-points",
  "positional-duplicates-and-permutations",
  "explicit-retained-numerical-storage-admission",
  "empty-and-singleton-collections",
  "point-local-primal-and-linearization-retention",
  "complete-versus-indexed-terminal-publication",
  "independently-inspectable-accepted-prefix",
  "between-occurrence-cooperative-cancellation",
]

[problem]
source_case = "differentiation.spatial-poisson-fem-fvm"
methods = ["continuous-q1-galerkin", "cell-centered-tpfa"]
spatial_dimension = 2
scalar = "native-f64"
execution = "host-serial"
program_inputs = ["source_scale", "diffusion", "boundary_offset"]
p0 = [1.0, 1.0, 0.0]
p1 = [2.0, 0.75, 0.5]
p2 = [3.0, 1.25, -0.25]
request_order = ["p2", "p1", "p2"]
permuted_order = ["p1", "p2", "p2"]

[oracle]
pointwise_owner = "differentiation.spatial-poisson-fem-fvm"
member_reference = "ordinary DifferentiableProgram::evaluate calls outside the map, at each complete requested point, separately for Q1 and TPFA"
member_observation = "exact program identity, ordered Parameter IDs, point and Field coefficient bits, state/accepted-output fingerprints, solver report, and full exposed primal evidence"
aggregate_observation = "one accepted member at every requested position, with duplicates and caller order preserved"
terminal_observation = "accepted prefix remains inspectable; exact failed/cancelled position and later not-started positions cannot be a complete collection"
derivative_observation = "JVP and VJP computed before other evaluations equal actions from the retained original and mapped repeated members afterwards"
fixed_scientific_values = false
new_field_digest = false
new_tolerance = false

[acceptance]
planning_performs_no_numerical_evaluation = true
execution_uses_only_the_retained_program = true
multiple_coordinates_vary = true
request_order_and_duplicates_preserved = true
no_default_anchor_required = true
empty_and_singleton_admitted = true
structural_errors_precede_execution = true
accepted_partial_members_remain_inspectable = true
partial_collection_is_never_complete = true
original_numerical_diagnostics_retained = true
completion_wins_after_final_member = true

[falsifiers]
sorting = "permuting the caller request leaves its member order unchanged"
deduplication = "two declared equal points lose one requested occurrence"
partial_publication = "a failed/cancelled collection is exposed as complete"
retargeting = "another evaluation changes an earlier point's primal/JVP/VJP"
failure_identity = "the failed index or original diagnostic is replaced"
structural_admission = "wrong arity, nonfinite input, or insufficient retained numerical budget is admitted"

[claim_boundary]
registered_execution_methods = ["continuous-q1-galerkin", "cell-centered-tpfa"]
partial_accepted_members = true
python_map_api = false
parallel_or_threaded = false
cuda = false
mpi = false
cache = false
derivative_across_map_axis = false
persistence_or_wire = false
peak_process_memory_bound = false

[evidence]
package = "eqiora"
test = "bounded_parameter_study"
