id = "differentiation.checkpointed-trajectory-adjoint"
status = "implemented"
scope = "discrete-adjoint-over-semantic-restart"
reference_kind = "centered-finite-difference"

capabilities = [
  "multi-step-discrete-adjoint",
  "explicit-step-state-continuity",
  "explicit-model-parameter-continuity",
  "validated-semantic-restart-boundary",
  "checkpoint-state-drift-rejection",
  "transposed-step-solves",
  "trajectory-gradient",
]

[problem]
residual = "(1 + z) (x_dot + p x) = 0; z - x^2 = 0"
trajectory = "four fixed implicit-Euler steps, h = 0.125"
restart = "content-addressed semantic checkpoint after step two"
objective = "z_final + 0.125 p"

[claim_boundary]
method = "fixed-step implicit Euler"
accepted_steps = 4
semantic_restart_boundaries = 1
adaptive_controller_derivative = false
bdf_history = false
checkpoint_schedule_optimization = false
backend_native_checkpoint_payload = false
derivative_run_provenance = false
intermediate_objective_terms = false

[evidence]
package = "eqiora"
test = "checkpointed_trajectory_adjoint"
