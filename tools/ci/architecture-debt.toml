# Architecture debt ledger
#
# Every entry is a technical exception to a predicate in
# `cargo xtask check-architecture`, frozen at the value it had when the
# predicate was introduced. Ordinary pull requests may only move a number
# down. Raising a ceiling or adding an entry is an architecture change and is
# reviewed as one.
#
# Seeded at revision 10b0a5d. These files predate the predicate and have not
# been individually triaged; `reason` says so rather than inventing a
# justification. Triage happens in the lane that owns the file.
#
# `[[public_surface]]` and `[[glob_reexports]]` were seeded at revision f5ae8c5,
# measured from the AST rather than by text matching. `[[glob_reexports]]` was
# reseeded when its frozen value stopped being the path text and became a
# resolved identity.
#
# The two ledgers ratchet differently, deliberately. A file's line count drifts
# with every ordinary edit, so `[[file_lines]]` only fails when the count rises
# above a frozen ceiling. A glob changes only when someone means it to, so
# `[[glob_reexports]]` freezes an exact identity per glob rather than a count. A
# count alone would let an existing glob be repointed at a larger crate for
# free, since the number would not move and the public-surface budget scores an
# unresolvable cross-crate glob as one item however much it forwards. The path
# text alone is no better: the same `pub use foo::*;` forwards a different crate
# after a Cargo rename is repointed, after a private `use bar as foo;` beside it
# is edited, or under a different `#[cfg]`.
#
# So an identity has three fields,
# `<condition> | <path as written>::* | <what the first segment resolves to>`:
#
#   * the condition is the normalized `#[cfg]` the glob sits under, including
#     the gates on every enclosing inline module, so flipping a feature moves
#     the entry. `cfg_attr` is not interpreted but is frozen verbatim;
#   * the path is the text a reader edits;
#   * the resolution is the package that first segment names according to
#     `cargo metadata`, after any Cargo `package = "..."` rename; or the file a
#     local `mod` declaration resolves to, `#[path]` included; or a private
#     `use ... as ...;` in the same module, followed to whichever of those it
#     lands on.
#
# The resolution records a package's name and origin, not its version. A version
# bump is not a repoint, and freezing it would fail this check on every ordinary
# dependency update and force a reseed of all 37 frozen globs, which is how a
# ratchet loses its credibility. Moving a dependency between path, registry and
# git — or between two paths — does move the identity.
#
# What the identity does NOT cover, and is not claimed to:
#
#   * which names the target actually exports. Resolution stops at the package
#     boundary, because one crate's AST cannot see another's. The *number* of
#     names a workspace glob forwards is held by the target crate's own
#     `[[public_surface]]` entry, which is an exact freeze; *which* names those
#     are is frozen nowhere.
#   * a `#[cfg]` on the `mod` declaration in a *parent* file. The scan is
#     file-local on purpose, so that a glob is caught even in a module no
#     consumer can name; the price is that a gate written next to `mod foo;` is
#     not part of the identity of the globs inside `foo.rs`.
#   * what an untracked `use x::*;` in the same module brings into scope, which
#     can shadow the first segment. The presence of such an import is recorded
#     in the identity, so it cannot appear silently, but its contents cannot be
#     enumerated from here.
#   * feature resolution and build-script `cargo::rustc-cfg` output. The
#     resolution reads declared dependencies, so it says which package a name
#     would resolve to, not whether that dependency is enabled in a given build.
#
# See docs/development/ai-authored-platform-strategy.md, amendment A5.

[limits]
# Physical lines for every Rust source discovered under `crates/` and `tools/`.
# A file with no entry below must satisfy its role limit.
production_file_lines = 1000
test_file_lines = 2000
# Absolute, no-debt limits for every Rust source discovered under `crates/`
# and `tools/`. File bytes include the complete source. Recursive token trees
# count every proc_macro2 leaf once and every Group once plus its contents.
# Physical-line bytes exclude LF; a preceding CR remains content.
source_file_bytes = 131072
source_token_trees = 20000
source_line_bytes = 4096
# AST-reachable public items. Every crate needs a `[[public_surface]]` entry
# below; this is the width above which that entry must also justify itself.
public_items_per_crate = 128

