crate = "eqiora-geometry"
ceiling = 38
reason = """
Raised from 23 as an architecture change, not as drift. The seven added names
are the authored-region vocabulary: a canonical straight-edged planar region,
its face and named entity set, its loop alias, and the three topological
dimension constants an entity set is written against. Two more names make its
content identity non-forgeable below artifact and semantic admission: one
opaque canonical geometry value and its mandatory wire-work budget. Together
they let a Model eventually own a shape that is not a box without accepting
caller-supplied digest/fact pairs. One borrowed, kind-erased reference now
projects only derived digest and dimension facts into semantic admission; it
cannot be constructed from those facts and exposes no geometry content. The
common canonical owner privately retains an exact circular hole as
rectangle bounds plus centre/radius identity, without putting mesh refinement
into the artifact or reopening either closed wire.
Four names now form the common provider-neutral authored CAD boundary: one
opaque graph owner over closed private wire versions, one graph-bound durable
face handle, one accepted build receipt, and one no-wire face surface
realization. The graph binds stable provenance keys directly into handles, so
Python, Studio, and Rust do not reimplement or publicly construct an
intermediate selection token. The face realization combines one exact source
handle with existing Geometry and Mesh owners without adding a policy schema,
request type, frame type, or artifact variant. The existing bounded CAD path
consumes the rectangle/extrusion history; the first circular through-cut
consumes the same owner with no circular-cut public type.
One no-wire volume-realization owner now retains that accepted surface, its
exact authored target graph, source-relative grading and work policy, and the
accepted tetrahedral mesh as one invariant. A loose tuple would let a consumer
substitute a foreign target or forget the direction and grading that produced
the mesh; no request schema, artifact variant, or provider registry was added.
One additional no-wire opaque `CadAuthoredSketch` owns the two closed profile
inputs admitted by the existing graph: one constrained XY rectangle with its
requested modeling tolerance and one exact circle bound to a v1 end-cap handle.
The public explicit Rust composition and the existing compatibility constructors
both consume this owner, so plane/profile discrimination, tolerance ownership,
signed-zero normalization, and foreign/stale handle rejection have one owner
before #367 projects it. It adds no wire, digest, operation registry, or general
constraint vocabulary.
"""
removal = "lower if the owned geometry value can replace the separate borrowed semantic reference without exposing content or caller-authored facts; lower if a second volume-meshing consumer proves that the no-wire sweep owner can become a private implementation behind an existing generic accepted Mesh/Realization boundary without losing its source and target binding; Replace `CadAuthoredSketch` and lower the ceiling by one when an accepted general versioned Sketch/constraint graph subsumes both closed inputs and both the legacy graph constructors and installed Python consume that one owner; do not retain both public sketch owners."

