# Public surface, in AST-reachable public items per crate. Counted by walking
# from `src/lib.rs` through `pub mod`, and into any private module a `pub use`
# re-exports. A glob over another crate cannot be resolved from one crate's AST
# and counts as one item; `[[glob_reexports]]` below is what contains that
# undercount, by forbidding any new glob from appearing.
#
# Every crate is frozen here, not only the three above the budget: "existing
# crates may not grow" is stronger than "existing crates stay under a limit". An
# entry is an exact freeze, so withdrawing a public name must lower the number
# in the same change, and a crate with no entry at all fails — otherwise
# deleting a line would be a way to buy headroom.
#
# `reason` and `removal` are required only where the frozen number is above
# `limits.public_items_per_crate`, which is where the entry is a real exception
# rather than a measurement. A new crate is expected to add an entry inside the
# budget. Amendment A5 additionally allows a public capability slice to add up
# to 8 net items; that is a review judgement on a raised number, not something
# this check can recognize on its own.

[[public_surface]]
crate = "eqiora"
ceiling = 240
reason = "the facade is re-export-only and its width is pinned by api/eqiora-facade-v1.json. The accepted common Plan contracts add no wire, provider registry, or generic solver service. The bounded Parameter-study and regeneration types retain exact application semantics that the common lifecycle does not yet subsume."
removal = "fold the regeneration pair into a general accepted parametric-CAD edit result only when it preserves exact transaction, complete-impact, and selection-retention evidence; withdraw the four Parameter-study types when a common study/result contract preserves exact program identity, total-ordered point keys, complete accepted membership, and atomic terminal evidence without weakening the bounded public claim. Lower this ceiling by the exact measured public items whenever an existing facade type is withdrawn without replacement."

