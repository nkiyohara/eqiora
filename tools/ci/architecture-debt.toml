reason = """
The current Model and ModelTransaction envelopes own the single admitted wire
epoch; validated content, canonical bytes, and digest derivation remain below
that boundary.
CartesianMeshEnvelopeV1 and CartesianQ1FieldSnapshotEnvelopeV1 close the exact
generated-mesh and Field-output identities needed to remove the bounded
structural result surface without triangulating Q1 cells or inventing a
lineage-free projection. They reuse the existing mesh and Field decoder
budgets and add no provider registry or extension trait.
CartesianMeshDecoderLimits is the one typed caller policy required to bound
axis-compressed all-strata entity and closure-reference amplification without
reinterpreting MeshDecoderLimits, breaking its external struct literals, or
serializing trust into the Cartesian wire.
MeshProductionLineageEnvelopeV1 and PlanarMeshQualityV1 are the closed
provider-occurrence wire and current Gmsh planar effective-policy value. They
keep provider identity/version outside provider-neutral Geometry, Mesh, and
correspondence artifacts, bind those resources, and add no provider registry,
discovery protocol, trait, builder, or ambient choice.
"""
