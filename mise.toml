min_version = "2026.5.10"

# mise owns developer-tool installation and task discovery only. Language and
# application dependencies remain owned by Cargo.lock, uv.lock, and the Studio
# package-lock.json; repository acceptance remains owned by local_verify.py.
[tools]
rust = { version = "stable", profile = "default", components = ["rustfmt", "clippy"] }
python = "3.13.14"
node = "24.18.1"
npm = "11.16.0"
uv = "0.12.1"

[tasks.setup]
description = "Install locked Studio dependencies after mise installs developer tools"
dir = "{{config_root}}/studio"
sources = [
  "{{config_root}}/mise.toml",
  "{{config_root}}/mise.lock",
  "{{config_root}}/studio/package.json",
  "{{config_root}}/studio/package-lock.json",
]
outputs = ["{{config_root}}/studio/node_modules/.package-lock.json"]
run = "npm ci"

[tasks.plan]
description = "Print the affected verification plan without executing it"
run = "python3 tools/ci/local_verify.py affected --base origin/main --plan"

[tasks.fast]
description = "Run the repository fast gate; trailing arguments are forwarded"
depends = ["setup"]
run = "python3 tools/ci/local_verify.py fast --base origin/main"

[tasks.affected]
description = "Run the pre-integration affected gate; trailing arguments are forwarded"
depends = ["setup"]
run = "python3 tools/ci/local_verify.py affected --base origin/main"

[tasks.periodic]
description = "Run the full current-machine compatibility gate"
depends = ["setup"]
run = "python3 tools/ci/local_verify.py periodic"

[tasks."studio:check"]
description = "Install and check the locked Studio dependency tree"
depends = ["setup"]
dir = "{{config_root}}/studio"
run = "npm run check"

[tasks."studio:test"]
description = "Install and run Studio unit tests"
depends = ["setup"]
dir = "{{config_root}}/studio"
run = "npm test"

[tasks."studio:dev"]
description = "Install and start the Studio development server"
depends = ["setup"]
dir = "{{config_root}}/studio"
run = "npm run dev"
