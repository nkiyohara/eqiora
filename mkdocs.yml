site_name: Eqiora
site_description: Meaning-first scientific modeling and simulation
site_url: https://eqiora.org/
repo_url: https://github.com/nkiyohara/eqiora
repo_name: nkiyohara/eqiora
edit_uri: edit/main/docs/site/

docs_dir: docs/site
site_dir: build/site
strict: true
use_directory_urls: true

theme:
  name: material
  custom_dir: docs/site/overrides
  language: en
  font: false
  favicon: assets/favicon.svg
  features:
    - content.code.copy
    - navigation.footer
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use light theme

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra:
  release: 0.1.0a1

nav:
  - Home: index.md
  - Get started: get-started.md
  - Python guide:
      - Overview: python/index.md
      - Modeling and realization: python/modeling.md
      - Execution and arrays: python/execution-and-arrays.md
      - Differentiation: python/differentiation.md
  - Concepts: concepts.md
  - Examples: examples.md
  - Capabilities:
      - Capability map: capabilities.md
      - Evidence catalog: evidence/index.md
  - Architecture: architecture.md
  - Contributing: contributing.md
  - API index: api.md
  - Release notes: release-notes.md

copyright: Copyright © Eqiora contributors · Apache-2.0
