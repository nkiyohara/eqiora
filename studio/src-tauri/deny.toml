# cargo-deny policy for the independent Studio Cargo workspace.
#
# Keep this separate from the root policy: Studio has its own lockfile and its
# Tauri shell has a different, explicitly reviewed license and advisory graph.

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# Tauri's cross-platform graph deliberately carries semver-incompatible
# platform crates. Advisory, license, source, and wildcard checks still inspect
# every resolved version; duplicate-version cleanup is not a release gate for
# this independently locked application shell.
multiple-versions = "allow"
wildcards = "deny"

[advisories]
yanked = "deny"
unsound = "all"
# Studio's optional CAD projection retains the exact Truck graph. cgmath's
# affected `swap_columns(a, a)` method is not called by Eqiora or that graph;
# proc-macro-error is an unmaintained build dependency. Re-audit both whenever
# the pinned Truck graph changes.
#
# Tauri 2 on Linux currently retains the archived GTK3 bindings. The exact
# notices below describe maintenance status, not reported vulnerabilities.
# Remove them when Tauri's maintained Linux shell no longer needs GTK3.
#
# glib 0.18.5's affected `VariantStrIter` implementation is not called by
# Eqiora Studio or the pinned Tauri/GTK graph. Remove this exception on any
# glib/Tauri boundary change or when a fixed compatible release is available.
#
# The pinned Eqiora numerical graph uses faer 0.24.4, whose gemm/pulp graph
# retains paste 1.0.15. RUSTSEC-2024-0436 is an unmaintained
# notice without a safe upgrade, not a reported vulnerability. Remove this
# exception when the accepted faer graph no longer resolves paste.
#
# tauri-utils -> urlpattern 0.3 retains the exact unmaintained rust-unic
# family. Remove these notices together when that upstream graph migrates.
# Never broaden an exception to a new advisory.
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0196",
    "RUSTSEC-2026-0197",
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    "RUSTSEC-2024-0429",
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
]
