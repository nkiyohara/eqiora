name: Documentation site

on:
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - ".cargo/config.toml"
      - "CHANGELOG.md"
      - "Cargo.lock"
      - "Cargo.toml"
      - "api/eqiora-facade-v1.json"
      - "bindings/python/python/eqiora/**/*.py"
      - "bindings/python/python/eqiora/**/*.pyi"
      - "crates/**"
      - "docs/capability-matrix.md"
      - "docs/python/api.md"
      - "docs/site/**"
      - "docs/verification/gallery/README.md"
      - "examples/python/exact_cylinder_geometry.py"
      - "examples/python/exact_cylinder_mesh.py"
      - "examples/python/exact_cylinder_stokes.py"
      - "examples/python/exact_cylinder_stokes_marimo.py"
      - "examples/steady-flow-past-cylinder.eqi"
      - "examples/steady-flow-past-cylinder.geometry.json"
      - "examples/steady-flow-past-cylinder.model.json"
      - "mise.lock"
      - "mise.toml"
      - "mkdocs.yml"
      - "packages/Eqiora.Fluid.Incompressible/src/incompressible.eqi"
      - "pyproject.toml"
      - "rust-toolchain.toml"
      - "schemas/control/compile-v2.schema.json"
      - "tools/docs/**"
      - "tools/release/python_candidate_common.py"
      - "tools/site/**"
      - "uv.lock"
      - "verify/artifacts/current-model-canonical-identity/**"
      - "verify/fluid/exact-circular-hole-stokes-2d/**"
      - "verify/fluid/packaged-steady-stokes-2d/**"
      - "verify/geometry/circular-hole-chordal-realization-binding/**"
      - "verify/geometry/circular-hole-chordal-reference-mesh/**"
      - "verify/geometry/exact-circular-hole-geometry/**"
      - "verify/interfaces/cli-compile-check/**"
      - "verify/interfaces/control-plane-compile-check/**"
      - "verify/interfaces/mcp-stdio-compile-check/README.md"
      - "verify/interfaces/mcp-stdio-compile-check/case.toml"
      - "verify/interfaces/mcp-stdio-compile-check/**"
      - "verify/interfaces/python-circular-hole-chordal-mesh/**"
      - "verify/interfaces/python-exact-circular-hole-geometry/**"
      - "verify/interfaces/python-exact-cylinder-pressure-still/**"
      - "verify/interfaces/python-exact-cylinder-stokes-marimo/**"
      - "verify/interfaces/python-exact-cylinder-stokes-result/**"
      - "verify/interfaces/studio-exact-cylinder-stokes-demo/**"
      - "verify/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - ".cargo/config.toml"
      - "CHANGELOG.md"
      - "Cargo.lock"
      - "Cargo.toml"
      - "api/eqiora-facade-v1.json"
      - "bindings/python/python/eqiora/**/*.py"
      - "bindings/python/python/eqiora/**/*.pyi"
      - "crates/**"
      - "docs/capability-matrix.md"
      - "docs/python/api.md"
      - "docs/site/**"
      - "docs/verification/gallery/README.md"
      - "examples/python/exact_cylinder_geometry.py"
      - "examples/python/exact_cylinder_mesh.py"
      - "examples/python/exact_cylinder_stokes.py"
      - "examples/python/exact_cylinder_stokes_marimo.py"
      - "examples/steady-flow-past-cylinder.eqi"
      - "examples/steady-flow-past-cylinder.geometry.json"
      - "examples/steady-flow-past-cylinder.model.json"
      - "mise.lock"
      - "mise.toml"
      - "mkdocs.yml"
      - "packages/Eqiora.Fluid.Incompressible/src/incompressible.eqi"
      - "pyproject.toml"
      - "rust-toolchain.toml"
      - "schemas/control/compile-v2.schema.json"
      - "tools/docs/**"
      - "tools/release/python_candidate_common.py"
      - "tools/site/**"
      - "uv.lock"
      - "verify/artifacts/current-model-canonical-identity/**"
      - "verify/fluid/exact-circular-hole-stokes-2d/**"
      - "verify/fluid/packaged-steady-stokes-2d/**"
      - "verify/geometry/circular-hole-chordal-realization-binding/**"
      - "verify/geometry/circular-hole-chordal-reference-mesh/**"
      - "verify/geometry/exact-circular-hole-geometry/**"
      - "verify/interfaces/cli-compile-check/**"
      - "verify/interfaces/control-plane-compile-check/**"
      - "verify/interfaces/mcp-stdio-compile-check/README.md"
      - "verify/interfaces/mcp-stdio-compile-check/case.toml"
      - "verify/interfaces/mcp-stdio-compile-check/**"
      - "verify/interfaces/python-circular-hole-chordal-mesh/**"
      - "verify/interfaces/python-exact-circular-hole-geometry/**"
      - "verify/interfaces/python-exact-cylinder-pressure-still/**"
      - "verify/interfaces/python-exact-cylinder-stokes-marimo/**"
      - "verify/interfaces/python-exact-cylinder-stokes-result/**"
      - "verify/interfaces/studio-exact-cylinder-stokes-demo/**"
      - "verify/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify static documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      LC_ALL: C
      TZ: UTC
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/eqiora-pw-1.62.1-r1234
      UV_CACHE_DIR: ${{ runner.temp }}/eqiora-site-uv-cache
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Restore the exact Playwright browser cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: eqiora-site-${{ runner.os }}-${{ runner.arch }}-playwright-1.62.1-r1234-${{ hashFiles('docs/site/package-lock.json') }}

      - name: Install the locked mise toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.5.10
          cache: true

      - name: Supply locked native, Rust, Python, Node, and browser inputs
        shell: bash
        run: |
          set -euo pipefail
          mise install
          test "$(node --version)" = "v24.18.1"
          test "$(npm --version)" = "11.16.0"
          test "$(python3 --version)" = "Python 3.13.14"
          test "$(uv --version)" = "uv 0.12.1 (x86_64-unknown-linux-musl)"
          test "$(rustc -Vv)" = "$(rustc +stable -Vv)"
          test "$(uname -m)" = "x86_64"
          node --version
          npm --version
          python3 --version
          uv --version
          cargo +stable --version
          rustc +stable -Vv

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libclang-dev libffi-dev libopenmpi-dev openmpi-bin

          npm ci --engine-strict --prefix docs/site
          node <<'NODE'
          const browsers = require('./docs/site/node_modules/playwright-core/browsers.json');
          for (const name of ['chromium', 'chromium-headless-shell']) {
            const browser = browsers.browsers.find((entry) => entry.name === name);
            if (!browser || browser.revision !== '1234' || browser.browserVersion !== '151.0.7922.34') {
              throw new Error(`unexpected ${name} identity: ${JSON.stringify(browser)}`);
            }
          }
          NODE
          npx --prefix docs/site playwright install --with-deps --only-shell chromium

          cargo +stable fetch --locked
          uv pip install --target "$RUNNER_TEMP/eqiora-site-build-supply" \
            --python 3.13 --no-python-downloads "maturin==1.14.1"

          browser_executable="$({ cd docs/site; node --input-type=module -e \
            "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())"; })"
          case "$browser_executable" in
            "$PLAYWRIGHT_BROWSERS_PATH"/*) ;;
            *) echo "Playwright executable escaped the named cache" >&2; exit 1 ;;
          esac
          test -x "$browser_executable"
          "$browser_executable" --version | tee "$RUNNER_TEMP/eqiora-site-browser-version.txt"
          test "$(cat "$RUNNER_TEMP/eqiora-site-browser-version.txt")" = "HeadlessChrome 151.0.7922.34"
          find "$PLAYWRIGHT_BROWSERS_PATH" -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/eqiora-site-browser-sha256.txt"
          find "$PLAYWRIGHT_BROWSERS_PATH" -type f -print0 | sort -z \
            | xargs -0 stat --printf='%s\t%n\n' \
            > "$RUNNER_TEMP/eqiora-site-browser-sizes.txt"
          cat "$RUNNER_TEMP/eqiora-site-browser-sha256.txt"
          cat "$RUNNER_TEMP/eqiora-site-browser-sizes.txt"
          sha256sum docs/site/package.json docs/site/package-lock.json \
            mise.toml mise.lock rust-toolchain.toml .cargo/config.toml uv.lock \
            > "$RUNNER_TEMP/eqiora-site-input-sha256.before"
          cat "$RUNNER_TEMP/eqiora-site-input-sha256.before"
          dpkg-query -W -f='${Package}\t${Version}\n' | sort \
            > "$RUNNER_TEMP/eqiora-site-dpkg-versions.txt"
          cat "$RUNNER_TEMP/eqiora-site-dpkg-versions.txt"
          printf 'ImageOS=%s\nImageVersion=%s\n' "${ImageOS:-unset}" "${ImageVersion:-unset}"
          uname -a
          rustc -Vv

      - name: Prepare the exact clean source and unique home-backed scratch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all -- ':!docs/site/node_modules')"
          test -d "$RUNNER_TEMP"
          test ! -L "$RUNNER_TEMP"
          scratch="$(mktemp -d "$RUNNER_TEMP/eqiora-site.XXXXXXXX")"
          scratch="$(realpath "$scratch")"
          case "$scratch" in
            "$RUNNER_TEMP"/eqiora-site.*) ;;
            *) echo "site scratch escaped RUNNER_TEMP" >&2; exit 1 ;;
          esac
          mkdir "$scratch/source" "$scratch/build" "$scratch/uv-cache"
          test -d "$UV_CACHE_DIR"
          cp -a "$UV_CACHE_DIR/." "$scratch/uv-cache/"
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$scratch/source"
          mv docs/site/node_modules "$scratch/source/docs/site/node_modules"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$GITHUB_SHA^{tree}")"

          {
            echo "EQIORA_API_SCRATCH=$scratch"
            echo "EQIORA_SITE_SOURCE_ROOT=$scratch/source"
            echo "EQIORA_SITE_ASTRO_OUT_DIR=$scratch/astro"
            echo "EQIORA_SITE_RUSTDOC_TARGET=$scratch/rustdoc-target"
            echo "EQIORA_SITE_RUSTDOC_STAGE=$scratch/rustdoc-stage"
            echo "EQIORA_SITE_ARTIFACT=$scratch/build/site"
            echo "EQIORA_SITE_SOURCE_SHA=$GITHUB_SHA"
            echo "EQIORA_RUNNER_UID=$(id -u)"
            echo "EQIORA_RUNNER_GID=$(id -g)"
            echo "EQIORA_RUNNER_HOME=$HOME"
            echo "EQIORA_RUNNER_PATH=$PATH"
          } >> "$GITHUB_ENV"

      - name: Build and verify with only loopback networking
        shell: bash
        run: |
          set -euo pipefail
          test -x "$EQIORA_SITE_SOURCE_ROOT/tools/site/run_offline_site_checks.sh"
          sudo --preserve-env=ASTRO_TELEMETRY_DISABLED,EQIORA_API_SCRATCH,EQIORA_SITE_SOURCE_ROOT,EQIORA_SITE_ASTRO_OUT_DIR,EQIORA_SITE_RUSTDOC_TARGET,EQIORA_SITE_RUSTDOC_STAGE,EQIORA_SITE_ARTIFACT,EQIORA_SITE_SOURCE_SHA,EQIORA_RUNNER_UID,EQIORA_RUNNER_GID,EQIORA_RUNNER_HOME,EQIORA_RUNNER_PATH,PLAYWRIGHT_BROWSERS_PATH,UV_CACHE_DIR,LC_ALL,TZ \
            unshare --net -- bash -ceu '
              ip link set lo up
              exec setpriv \
                --reuid "$EQIORA_RUNNER_UID" \
                --regid "$EQIORA_RUNNER_GID" \
                --clear-groups \
                -- env \
                  HOME="$EQIORA_RUNNER_HOME" \
                  PATH="$EQIORA_RUNNER_PATH" \
                  LC_ALL="$LC_ALL" \
                  TZ="$TZ" \
                  ASTRO_TELEMETRY_DISABLED="$ASTRO_TELEMETRY_DISABLED" \
                  npm_config_offline=true \
                  CARGO_NET_OFFLINE=true \
                  UV_OFFLINE=1 \
                  PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
                  UV_CACHE_DIR="$UV_CACHE_DIR" \
                  EQIORA_API_SCRATCH="$EQIORA_API_SCRATCH" \
                  EQIORA_SITE_SOURCE_ROOT="$EQIORA_SITE_SOURCE_ROOT" \
                  EQIORA_SITE_ASTRO_OUT_DIR="$EQIORA_SITE_ASTRO_OUT_DIR" \
                  EQIORA_SITE_RUSTDOC_TARGET="$EQIORA_SITE_RUSTDOC_TARGET" \
                  EQIORA_SITE_RUSTDOC_STAGE="$EQIORA_SITE_RUSTDOC_STAGE" \
                  EQIORA_SITE_ARTIFACT="$EQIORA_SITE_ARTIFACT" \
                  EQIORA_SITE_SOURCE_SHA="$EQIORA_SITE_SOURCE_SHA" \
                  "$EQIORA_SITE_SOURCE_ROOT/tools/site/run_offline_site_checks.sh"
            '

      - name: Recheck exact inputs and checked artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -f "$EQIORA_SITE_ARTIFACT/index.html"
          test -f "$EQIORA_SITE_ARTIFACT/pagefind/pagefind.js"
          test -f "$EQIORA_SITE_ARTIFACT/reference/rust/api/eqiora/index.html"
          test -f "$EQIORA_SITE_ARTIFACT/reference/control-v2/compile-v2.schema.json"
          sha256sum docs/site/package.json docs/site/package-lock.json \
            mise.toml mise.lock rust-toolchain.toml .cargo/config.toml uv.lock \
            > "$RUNNER_TEMP/eqiora-site-input-sha256.after"
          cmp --silent \
            "$RUNNER_TEMP/eqiora-site-input-sha256.before" \
            "$RUNNER_TEMP/eqiora-site-input-sha256.after"
          sha256sum .github/workflows/pages.yml
          find "$EQIORA_SITE_ARTIFACT" -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/eqiora-site-artifact-sha256.txt"
          sha256sum "$RUNNER_TEMP/eqiora-site-artifact-sha256.txt"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.EQIORA_SITE_ARTIFACT }}

      - name: Remove the resolved site scratch child
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          candidate_text = os.environ.get("EQIORA_API_SCRATCH")
          runner_temp_text = os.environ.get("RUNNER_TEMP")
          if not candidate_text or not runner_temp_text:
              raise SystemExit(0)
          candidate = Path(candidate_text).resolve(strict=True)
          runner_temp = Path(runner_temp_text).resolve(strict=True)
          if candidate.parent != runner_temp or not candidate.name.startswith("eqiora-site."):
              raise SystemExit(f"refusing unsafe site scratch cleanup: {candidate}")
          shutil.rmtree(candidate)
          PY

  deploy:
    name: Deploy static documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
