name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please do not report security vulnerabilities here; use SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the engineering or semantic consequence.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include model, command, revision, and complete diagnostics.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Rust version, target/backend
    validations:
      required: true
